name: ultralytics_yolo_example
description: "Demonstrates how to use the ultralytics_yolo plugin on desktop platforms."
publish_to: "none"
version: 0.6.0+1

environment:
  sdk: ^3.8.1
  flutter: ">=3.32.1"

dependencies:
  cupertino_icons: ^1.0.9
  file_picker: ^8.0.0
  flutter:
    sdk: flutter
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  share_plus: ^12.0.0
  ultralytics_yolo:
    path: ../

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/models/
